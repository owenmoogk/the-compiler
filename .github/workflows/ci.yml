name: Build, Test, Release, and Deploy

on:
  push:
    branches:
      - '*'

    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Builds backend/dist/server.js (one bundled file) and frontend/dist.
      - name: Build
        run: yarn build

      - name: Upload frontend for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/

      - name: Archive builds for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          (cd backend && zip -r ../backend-dist.zip dist/)
          (cd frontend && zip -r ../frontend-dist.zip dist/)
      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: dist-zips
          path: |
            backend-dist.zip
            frontend-dist.zip

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Type Check
        run: yarn typecheck

  image:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every push checks that the image builds; a v* tag also pushes it as
      # ghcr.io/owenmoogk/the-compiler:<tag> and :latest.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/owenmoogk/the-compiler:${{ github.ref_name }}
            ghcr.io/owenmoogk/the-compiler:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-zips
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Automated release for ${{ github.ref_name }}.
            Includes backend-dist-${{ github.ref_name }}.zip and frontend-dist-${{ github.ref_name }}.zip.
      - name: Upload backend asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: backend-dist.zip
          asset_name: backend-dist-${{ github.ref_name }}.zip
          asset_content_type: application/zip
      - name: Upload frontend asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: frontend-dist.zip
          asset_name: frontend-dist-${{ github.ref_name }}.zip
          asset_content_type: application/zip

  deploy-frontend:
    name: Deploy frontend to Pages
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    name: Deploy backend to server
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [release, image]
    # One deploy at a time; a newer tag waits for the one in progress.
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      # SSH reaches the server through the Cloudflare Tunnel, behind a Cloudflare
      # Access service token. The deploy key can only run ~/the-compiler/deploy.sh
      # (backend/deploy/deploy.sh), which installs backend/deploy/compose.yaml from
      # stdin, pulls the image for this tag and restarts the container.
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ProxyCommand='cloudflared access ssh --hostname %h' \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_REF_NAME" < backend/deploy/compose.yaml
