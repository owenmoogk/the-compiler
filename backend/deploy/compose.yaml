# Runs on the server from ~/the-compiler. CI sends this file and secrets.env with each
# deploy (see backend/deploy/deploy.sh); TAG, APP_UID and APP_GID come from ~/the-compiler/.env.
name: the-compiler

services:
  backend:
    image: ghcr.io/owenmoogk/the-compiler:${TAG:?set TAG in .env}
    restart: unless-stopped
    init: true
    # Listens on 127.0.0.1:8788 on the host's network, where cloudflared reaches it.
    network_mode: host
    # Run as the owner of ./data so files it writes stay editable on the host.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # SESSION_KEY and GITHUB_APP_CLIENT_SECRET, written by each deploy from the repo's
    # GitHub secrets (see the deploy-backend job in ci.yml).
    env_file:
      - path: ./secrets.env
        format: raw
    environment:
      PORT: "8788"
      HOST: 127.0.0.1
      PUBLIC_URL: https://compiler.owenmoogk.com
      FRONTEND_URL: https://owenmoogk.com/the-compiler/
      GITHUB_APP_CLIENT_ID: Iv23liA6jgAzKqvyRi6o
      # GitHub user id of owenmoogk, the only account that can edit.
      EDITOR_GITHUB_ID: "58040528"
      # State the server writes: bookmarks.json (the only copy) and sessions.enc.
      # Backed up nightly by the backup service below.
      DATA_DIR: /data
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Stay out of the way of anything else on the box (e.g. a game server).
    cpus: 0.5
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  # Nightly backup of data/ to the NAS: one archive per night in
  # /mnt/nas/minecraft/server-state/the-compiler/, kept 30 days. Restore by stopping the app and
  # untarring an archive into this folder with --strip-components=1 (it holds data/).
  # To back up somewhere else, change BACKUP_ARCHIVE or add one of the image's other
  # storage backends: https://offen.github.io/docker-volume-backup/
  backup:
    image: offen/docker-volume-backup:v2.50.2
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # The image skips a missing archive folder without failing, so create it first.
    entrypoint: ["sh", "-c", "mkdir -p \"$$BACKUP_ARCHIVE\" && exec backup -foreground"]
    environment:
      BACKUP_CRON_EXPRESSION: "30 3 * * *"   # UTC
      BACKUP_FILENAME: the-compiler_%Y-%m-%d_%H-%M-%S.tar.gz
      BACKUP_ARCHIVE: /nas/server-state/the-compiler
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_PRUNING_PREFIX: the-compiler_
    volumes:
      - ./data:/backup/data:ro
      # The NAS share (a systemd automount on the host, see the homelab repo). rslave lets
      # the container see it mount and unmount after it has started.
      - type: bind
        source: /mnt/nas/minecraft
        target: /nas
        bind:
          propagation: rslave
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
      - /var/lock
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
